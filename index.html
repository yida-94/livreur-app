<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livreurs · 固定用户版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #e9eff5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.1);
        }
        .login-box {
            background: #f5faff;
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            margin: 0 auto;
        }
        .login-box h2 {
            color: #1d4a72;
            margin-bottom: 30px;
            text-align: center;
        }
        .login-input {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px solid #b9cfe6;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #2f6d9e;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 4px solid #123d5c;
        }
        .login-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .user-info-bar {
            background: #d4e3fd;
            border-radius: 40px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #e05a5a;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }
        .user-selector {
            background: #f5faff;
            border-radius: 30px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .user-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .user-button {
            background: white;
            border: 2px solid #b0c8e5;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            color: #1f4a7a;
            cursor: pointer;
        }
        .user-button.active {
            background: #2b5879;
            color: white;
        }
        .user-button.own {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        .dual-date-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .date-card {
            flex: 1;
            background: #f5faff;
            border-radius: 30px;
            padding: 15px 20px;
        }
        .date-picker-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #b9cfe6;
            border-radius: 30px;
        }
        .driver-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: #edf2f9;
            padding: 6px;
            border-radius: 50px;
        }
        .driver-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .driver-tab.active {
            background: white;
            color: #003153;
        }
        .input-section {
            background: #f5faff;
            border-radius: 30px;
            padding: 18px 16px;
            margin-bottom: 22px;
        }
        .input-section.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .input-field {
            background: white;
            border-radius: 24px;
            padding: 4px 20px;
            border: 1px solid #b9cfe6;
            margin: 10px 0;
        }
        .input-field input, .input-field select {
            width: 100%;
            padding: 14px 0;
            border: none;
            outline: none;
            background: transparent;
        }
        .btn-add {
            background: #2f6d9e;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 34px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .customer-list {
            list-style: none;
            margin-bottom: 16px;
        }
        .customer-item {
            background: #f8f9fc;
            border-radius: 26px;
            padding: 16px 18px;
            margin: 10px 0;
            border: 1px solid #c7daf0;
        }
        .customer-item.departed {
            background: #e3f0e3;
        }
        .customer-item.other-user {
            border-left: 6px solid #ff9800;
        }
        .meta-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .time-badge {
            background: #ddeeff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
        }
        .added-by {
            background: #e6d5b8;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .validated-by {
            background: #c8e6c9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .item-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .btn-depart {
            background: #2b8c5e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete {
            background: transparent;
            border: 1px solid #d0ddee;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .readonly-badge {
            background: #ff9800;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .current-view-badge {
            background: #d4e3fd;
            padding: 8px 16px;
            border-radius: 30px;
            margin: 10px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #2f6d9e;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-overlay" id="loginOverlay" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div class="login-box">
            <h2>🔐 Connexion</h2>
            <input type="text" class="login-input" id="loginUsername" placeholder="Nom d'utilisateur">
            <input type="password" class="login-input" id="loginPassword" placeholder="Mot de passe">
            <button class="login-btn" id="loginBtn">Se connecter</button>
            <div style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 20px;">
                <p style="color: #2e7d32; font-weight: bold;">📝 固定账号：</p>
                <p>👤 tayfun / 1909</p>
                <p>👤 xuefeng / 1998</p>
                <p>👤 steve / 94</p>
            </div>
        </div>
    </div>

    <!-- 主应用 -->
    <div class="app-container" id="app" style="display: none;">
        <div class="user-info-bar">
            <span id="currentUserDisplay">👤 </span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>

        <!-- 用户选择器（查看其他人数据） -->
        <div class="user-selector">
            <div class="selector-label">👁️ Voir les données d'autres utilisateurs</div>
            <div class="user-buttons" id="userSelectorButtons"></div>
        </div>

        <!-- 双日期选择 -->
        <div class="dual-date-section">
            <div class="date-card">
                <div class="label">📅 Date d'ajout</div>
                <input type="date" id="inputDate" class="date-picker-input">
            </div>
            <div class="date-card">
                <div class="label">👁️ Date à visualiser</div>
                <input type="date" id="viewDate" class="date-picker-input">
            </div>
        </div>

        <!-- 司机选项卡 -->
        <div class="driver-tabs" id="driverTabs"></div>

        <!-- 当前视图提示 -->
        <div class="current-view-badge" id="currentViewHint"></div>

        <!-- 录入区域 -->
        <div class="input-section" id="inputSection">
            <div class="section-title">📝 Ajouter un client</div>
            <div class="input-field"><input type="text" id="customerName" placeholder="Nom"></div>
            <div class="input-field"><input type="text" id="customerAddr" placeholder="Adresse"></div>
            <select id="timeType" style="width:100%; padding:14px; margin:10px 0; border-radius:24px; border:1px solid #b9cfe6;">
                <option value="fixed">Heure fixe</option>
                <option value="before">Avant</option>
                <option value="range">Intervalle</option>
                <option value="free">Libre</option>
            </select>
            <div id="timeInputContainer">
                <div class="input-field"><input type="time" id="fixedTime" value="10:00"></div>
            </div>
            <button class="btn-add" id="addCustomerBtn">➕ Ajouter</button>
        </div>

        <!-- 顾客列表 -->
        <h3>📋 Liste des clients</h3>
        <div id="loadingMessage" class="loading" style="display: none;">Chargement...</div>
        <ul class="customer-list" id="customerList"></ul>

        <!-- 路线规划 -->
        <button class="btn-add" id="optimizeRouteBtn" style="background:#ff9f4b; color:#aa5f1e;">🗺️ Optimiser l'itinéraire</button>
        <div id="routeOutput" style="display:none; margin-top:20px; padding:16px; background:#edf4fd; border-radius:24px;">
            <h4>🚚 Ordre de livraison suggéré</h4>
            <ul id="routeStepsList"></ul>
            <div id="routeNote" style="font-size:0.7rem; color:#3a5b7a;"></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 固定用户数据 ====================
            const USERS = {
                'tayfun': '1909',
                'xuefeng': '1998',
                'steve': '94'
            };

            // Supabase 配置
            const supabase = window.supabase.createClient(
                'https://jmywqokewgnnypqugqev.supabase.co',
                'sb_publishable_XXkyyl1z7V7D3w1x1sfppA_OPDEFkig'
            );

            // 全局状态
            let currentUser = null;
            let currentUserId = null;
            let viewingUser = null;
            let viewingUserId = null;
            let currentDriver = 'Edwin';
            let inputDate = new Date().toISOString().split('T')[0];
            let viewDate = new Date().toISOString().split('T')[0];

            // DOM 元素
            const loginOverlay = document.getElementById('loginOverlay');
            const appContainer = document.getElementById('app');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const currentUserDisplay = document.getElementById('currentUserDisplay');
            const userSelectorButtons = document.getElementById('userSelectorButtons');
            const inputSection = document.getElementById('inputSection');
            const driverTabsEl = document.getElementById('driverTabs');
            const currentViewHint = document.getElementById('currentViewHint');
            const inputDatePicker = document.getElementById('inputDate');
            const viewDatePicker = document.getElementById('viewDate');
            const inputDateHint = document.getElementById('inputDateHint');
            const viewDateHint = document.getElementById('viewDateHint');
            const customerListEl = document.getElementById('customerList');
            const loadingMessage = document.getElementById('loadingMessage');
            const optimizeBtn = document.getElementById('optimizeRouteBtn');
            const routeOutputDiv = document.getElementById('routeOutput');
            const routeStepsList = document.getElementById('routeStepsList');
            const routeNote = document.getElementById('routeNote');
            const nameInput = document.getElementById('customerName');
            const addrInput = document.getElementById('customerAddr');
            const timeType = document.getElementById('timeType');
            const timeInputContainer = document.getElementById('timeInputContainer');
            const addBtn = document.getElementById('addCustomerBtn');

            // 设置默认日期
            function setDefaultDates() {
                const today = new Date().toISOString().split('T')[0];
                if (inputDatePicker) inputDatePicker.value = today;
                if (viewDatePicker) viewDatePicker.value = today;
            }

            // 渲染时间输入
            function renderTimeInput() {
                const type = timeType.value;
                let html = '';
                if (type === 'fixed') {
                    html = `<div class="input-field"><input type="time" id="fixedTime" value="10:00"></div>`;
                } else if (type === 'before') {
                    html = `<div class="input-field"><input type="time" id="beforeTime" value="18:00"></div><span>avant</span>`;
                } else if (type === 'range') {
                    html = `<div style="display:flex; gap:5px;"><div class="input-field"><input type="time" id="rangeStart" value="09:00"></div><span> - </span><div class="input-field"><input type="time" id="rangeEnd" value="17:00"></div></div>`;
                } else {
                    html = `<span>Libre</span>`;
                }
                timeInputContainer.innerHTML = html;
            }
            if (timeType) timeType.addEventListener('change', renderTimeInput);

            // 登录
            function login(username, password) {
                if (USERS[username] && USERS[username] === password) {
                    currentUser = username;
                    viewingUser = username;
                    currentUserDisplay.innerText = `👤 ${currentUser}`;
                    loginOverlay.style.display = 'none';
                    appContainer.style.display = 'block';
                    
                    currentDriver = 'Edwin';
                    
                    renderUserSelector();
                    renderDriverTabs();
                    loadCustomers();
                    updateInputSectionState();
                    updateHints();
                    return true;
                }
                return false;
            }

            // 登出
            function logout() {
                currentUser = null;
                viewingUser = null;
                appContainer.style.display = 'none';
                loginOverlay.style.display = 'flex';
                loginUsername.value = '';
                loginPassword.value = '';
            }

            // 登录按钮
            loginBtn.addEventListener('click', () => {
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();
                if (login(username, password)) {
                    // 成功
                } else {
                    alert('Nom d\'utilisateur ou mot de passe incorrect');
                }
            });

            // 回车登录
            if (loginPassword) {
                loginPassword.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') loginBtn.click();
                });
            }

            logoutBtn.addEventListener('click', logout);

            // 渲染用户选择器
            function renderUserSelector() {
                let html = '';
                Object.keys(USERS).forEach(user => {
                    const activeClass = (viewingUser === user) ? 'active' : '';
                    const ownClass = (user === currentUser) ? 'own' : '';
                    const label = user === currentUser ? `${user} (moi)` : user;
                    html += `<button class="user-button ${activeClass} ${ownClass}" data-user="${user}">👤 ${label}</button>`;
                });
                userSelectorButtons.innerHTML = html;

                document.querySelectorAll('.user-button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        viewingUser = btn.dataset.user;
                        renderUserSelector();
                        renderDriverTabs();
                        loadCustomers();
                        updateInputSectionState();
                        updateHints();
                        routeOutputDiv.style.display = 'none';
                    });
                });
            }

            // 更新录入区域状态
            function updateInputSectionState() {
                if (viewingUser === currentUser) {
                    inputSection.classList.remove('disabled');
                } else {
                    inputSection.classList.add('disabled');
                }
            }

            // 渲染司机选项卡
            function renderDriverTabs() {
                const drivers = ['Edwin', 'Jismon', 'Wang'];
                let html = '';
                drivers.forEach(driver => {
                    const activeClass = (currentDriver === driver) ? 'active' : '';
                    html += `<button class="driver-tab ${activeClass}" data-driver="${driver}">👤 ${driver}</button>`;
                });
                driverTabsEl.innerHTML = html;

                document.querySelectorAll('.driver-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        currentDriver = tab.dataset.driver;
                        renderDriverTabs();
                        loadCustomers();
                        updateHints();
                        routeOutputDiv.style.display = 'none';
                    });
                });
            }

            // 更新提示
            function updateHints() {
                if (inputDateHint) inputDateHint.innerText = `Date d'ajout: ${inputDate}`;
                if (viewDateHint) viewDateHint.innerText = `Date visualisée: ${viewDate}`;
                if (currentViewHint) {
                    currentViewHint.innerText = `Utilisateur: ${currentUser} | Vue: ${viewingUser} | Chauffeur: ${currentDriver} | Ajout: ${inputDate} | Visualisation: ${viewDate}`;
                }
            }

            // 日期变更
            if (inputDatePicker) {
                inputDatePicker.addEventListener('change', (e) => {
                    inputDate = e.target.value;
                    updateHints();
                });
            }

            if (viewDatePicker) {
                viewDatePicker.addEventListener('change', (e) => {
                    viewDate = e.target.value;
                    loadCustomers();
                    routeOutputDiv.style.display = 'none';
                    updateHints();
                });
            }

            // ==================== 数据库操作 ====================

            // 加载顾客
            async function loadCustomers() {
                try {
                    loadingMessage.style.display = 'block';
                    
                    const { data, error } = await supabase
                        .from('customers')
                        .select('*')
                        .eq('username', viewingUser)
                        .eq('driver', currentDriver)
                        .eq('date', viewDate)
                        .order('added_time', { ascending: false });
                    
                    if (error) throw error;
                    
                    renderCustomerList(data || []);
                } catch (error) {
                    console.error('加载失败:', error);
                } finally {
                    loadingMessage.style.display = 'none';
                }
            }

            // 保存顾客
            async function saveCustomer(customer) {
                try {
                    const { error } = await supabase
                        .from('customers')
                        .insert([{
                            username: currentUser,
                            driver: currentDriver,
                            date: inputDate,
                            customer_name: customer.name,
                            customer_address: customer.address,
                            time_req: customer.timeReq,
                            added_time: customer.addedTime,
                            added_by: customer.addedBy,
                            departed: customer.departed,
                            departure_time: customer.departureTime,
                            departed_by: customer.departedBy
                        }]);
                    
                    if (error) throw error;
                } catch (error) {
                    console.error('保存失败:', error);
                    throw error;
                }
            }

            // 更新顾客（标记出发）
            async function updateCustomer(customerId, updates) {
                try {
                    const { error } = await supabase
                        .from('customers')
                        .update(updates)
                        .eq('id', customerId);
                    
                    if (error) throw error;
                } catch (error) {
                    console.error('更新失败:', error);
                    throw error;
                }
            }

            // 删除顾客
            async function deleteCustomerFromCloud(customerId) {
                try {
                    const { error } = await supabase
                        .from('customers')
                        .delete()
                        .eq('id', customerId)
                        .eq('username', currentUser);
                    
                    if (error) throw error;
                } catch (error) {
                    console.error('删除失败:', error);
                    throw error;
                }
            }

            // 获取时间值
            function getTimeValue() {
                const type = timeType.value;
                if (type === 'fixed') {
                    const fixed = document.getElementById('fixedTime');
                    return { type: 'fixed', value: fixed ? fixed.value : '10:00' };
                } else if (type === 'before') {
                    const before = document.getElementById('beforeTime');
                    return { type: 'before', value: before ? before.value : '18:00' };
                } else if (type === 'range') {
                    const start = document.getElementById('rangeStart');
                    const end = document.getElementById('rangeEnd');
                    return { type: 'range', value: { start: start ? start.value : '09:00', end: end ? end.value : '17:00' } };
                } else {
                    return { type: 'free', value: null };
                }
            }

            // 格式化时间
            function formatTimeRequirement(customer) {
                const t = customer.time_req;
                if (!t) return '⏰ Libre';
                if (t.type === 'fixed') return `⏰ ${t.value}`;
                if (t.type === 'before') return `⏰ avant ${t.value}`;
                if (t.type === 'range') return `⏰ ${t.value.start} - ${t.value.end}`;
                return '⏰ Libre';
            }

            // 格式化添加时间
            function formatAddedTime(timestamp) {
                if (!timestamp) return '';
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            }

            // 添加顾客
            addBtn.addEventListener('click', async () => {
                if (viewingUser !== currentUser) {
                    alert('Vous ne pouvez ajouter que dans vos propres données');
                    return;
                }

                const name = nameInput.value.trim();
                const addr = addrInput.value.trim();
                if (!name || !addr) {
                    alert('Veuillez remplir le nom et l\'adresse');
                    return;
                }

                const timeReq = getTimeValue();
                const now = Date.now();
                const newCustomer = {
                    name: name,
                    address: addr,
                    timeReq: timeReq,
                    addedTime: now,
                    addedBy: currentUser,
                    departed: false,
                    departureTime: null,
                    departedBy: null
                };

                try {
                    loadingMessage.style.display = 'block';
                    await saveCustomer(newCustomer);
                    
                    nameInput.value = '';
                    addrInput.value = '';

                    if (viewDate === inputDate && viewingUser === currentUser) {
                        await loadCustomers();
                    }
                    routeOutputDiv.style.display = 'none';
                } catch (error) {
                    alert('Erreur: ' + error.message);
                } finally {
                    loadingMessage.style.display = 'none';
                }
            });

            // 删除顾客
            async function deleteCustomer(custId) {
                if (viewingUser !== currentUser) {
                    alert('Vous ne pouvez pas supprimer les données d\'autres utilisateurs');
                    return;
                }

                try {
                    loadingMessage.style.display = 'block';
                    await deleteCustomerFromCloud(custId);
                    await loadCustomers();
                    routeOutputDiv.style.display = 'none';
                } catch (error) {
                    alert('Erreur: ' + error.message);
                } finally {
                    loadingMessage.style.display = 'none';
                }
            }

            // 标记出发
            async function markCustomerDeparted(custId) {
                try {
                    loadingMessage.style.display = 'block';
                    await updateCustomer(custId, {
                        departed: true,
                        departure_time: Date.now(),
                        departed_by: currentUser
                    });
                    await loadCustomers();
                } catch (error) {
                    alert('Erreur: ' + error.message);
                } finally {
                    loadingMessage.style.display = 'none';
                }
            }

            // 渲染顾客列表
            function renderCustomerList(customers) {
                const isOwnData = (viewingUser === currentUser);

                let html = '';
                if (customers.length === 0) {
                    html = '<li style="padding:30px; text-align:center; color:#8899bb;">Aucun client</li>';
                } else {
                    customers.forEach(c => {
                        const timeDisplay = formatTimeRequirement(c);
                        const addedDisplay = formatAddedTime(c.added_time);
                        const departedClass = c.departed ? 'departed' : '';
                        const otherUserClass = (c.added_by !== viewingUser) ? 'other-user' : '';
                        const departedInfo = c.departed ? 
                            `<div>🚚 Départ: ${new Date(c.departure_time).toLocaleTimeString()}</div>` : '';
                        const validatedInfo = c.departed && c.departed_by ? 
                            `<span class="validated-by">✅ Validé par: ${c.departed_by}</span>` : '';
                        
                        const showDepart = true;
                        const showDelete = isOwnData;
                        
                        html += `
                            <li class="customer-item ${departedClass} ${otherUserClass}">
                                <div><strong>${escapeHtml(c.customer_name)}</strong></div>
                                <div>📍 ${escapeHtml(c.customer_address)}</div>
                                <div class="meta-row">
                                    <span class="time-badge">${timeDisplay}</span>
                                    <span class="added-by">👤 Ajouté par: ${escapeHtml(c.added_by || 'unknown')}</span>
                                    ${validatedInfo}
                                </div>
                                ${departedInfo}
                                <div class="item-actions">
                                    ${showDepart ? `<button class="btn-depart" ${c.departed ? 'disabled' : ''} data-id="${c.id}">🚚 Partir</button>` : ''}
                                    ${showDelete ? `<button class="btn-delete" ${c.departed ? 'disabled' : ''} data-id="${c.id}">🗑️ Supprimer</button>` : ''}
                                    ${!showDepart && !showDelete ? '<span class="readonly-badge">🔒 Lecture seule</span>' : ''}
                                </div>
                            </li>
                        `;
                    });
                }
                customerListEl.innerHTML = html;

                // 绑定事件
                document.querySelectorAll('.btn-depart').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        markCustomerDeparted(btn.dataset.id);
                    });
                });
                
                if (isOwnData) {
                    document.querySelectorAll('.btn-delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteCustomer(btn.dataset.id);
                        });
                    });
                }
            }

            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 路线规划
            optimizeBtn.addEventListener('click', async () => {
                try {
                    loadingMessage.style.display = 'block';
                    
                    const { data } = await supabase
                        .from('customers')
                        .select('*')
                        .eq('username', viewingUser)
                        .eq('driver', currentDriver)
                        .eq('date', viewDate)
                        .eq('departed', false);
                    
                    const pending = data || [];
                    
                    if (pending.length === 0) {
                        alert('Aucun client en attente');
                        return;
                    }

                    // 简单按时间排序
                    const optimized = pending.sort((a,b) => {
                        const getTime = (c) => {
                            if (c.time_req?.type === 'fixed') return c.time_req.value;
                            return '23:59';
                        };
                        return (getTime(a) || '23:59').localeCompare(getTime(b) || '23:59');
                    });

                    let stepsHtml = '';
                    optimized.forEach((c, idx) => {
                        stepsHtml += `
                            <li>
                                <span style="background:#f09b4b; color:white; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%;">${idx+1}</span>
                                <strong>${escapeHtml(c.customer_name)}</strong> - ${escapeHtml(c.customer_address)}
                                <span style="background:#ffe6c0; padding:2px 8px; border-radius:20px;">${formatTimeRequirement(c)}</span>
                                <span style="background:#e6d5b8; padding:2px 8px; border-radius:20px;">👤 ${escapeHtml(c.added_by)}</span>
                            </li>
                        `;
                    });
                    routeStepsList.innerHTML = stepsHtml;
                    routeNote.innerText = '* Optimisé selon les horaires';
                    routeOutputDiv.style.display = 'block';
                } catch (error) {
                    console.error('规划失败:', error);
                } finally {
                    loadingMessage.style.display = 'none';
                }
            });

            // 初始化
            setDefaultDates();
            renderTimeInput();
        })();
    </script>
</body>
</html>
