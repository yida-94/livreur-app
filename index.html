<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livreurs · 路线优化版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #e9eff5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app-container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.1);
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: #f5faff;
            border-radius: 30px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            margin: 0 auto;
        }
        .login-box h2 {
            color: #1d4a72;
            margin-bottom: 30px;
            text-align: center;
        }
        .login-input {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px solid #b9cfe6;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #2f6d9e;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .register-link {
            text-align: center;
            color: #2f6d9e;
            cursor: pointer;
            margin-top: 15px;
        }
        .user-info-bar {
            background: #d4e3fd;
            border-radius: 40px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #e05a5a;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .admin-section {
            background: #fff3e0;
            border-radius: 30px;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px solid #ffb74d;
        }
        .admin-section h3 {
            color: #e65100;
            margin-bottom: 15px;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        .user-tag {
            background: white;
            border: 2px solid #ffb74d;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .remove-user {
            color: #f44336;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .user-selector {
            background: #f5faff;
            border-radius: 30px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .user-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .user-button {
            background: white;
            border: 2px solid #b0c8e5;
            border-radius: 40px;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-button.active {
            background: #2b5879;
            color: white;
        }
        .user-button.own {
            border-color: #4caf50;
            background: #e8f5e9;
        }
        .dual-date-section {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .date-card {
            flex: 1;
            background: #f5faff;
            border-radius: 30px;
            padding: 15px 20px;
        }
        .date-picker-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #b9cfe6;
            border-radius: 30px;
        }
        .driver-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            background: #edf2f9;
            padding: 6px;
            border-radius: 50px;
        }
        .driver-tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .driver-tab.active {
            background: white;
            color: #003153;
        }
        .input-section {
            background: #f5faff;
            border-radius: 30px;
            padding: 18px 16px;
            margin-bottom: 22px;
        }
        .input-section.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .input-field {
            background: white;
            border-radius: 24px;
            padding: 4px 20px;
            border: 1px solid #b9cfe6;
            margin: 10px 0;
        }
        .input-field input, .input-field select {
            width: 100%;
            padding: 14px 0;
            border: none;
            outline: none;
            background: transparent;
        }
        .btn-add {
            background: #2f6d9e;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 34px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .customer-list {
            list-style: none;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        .customer-item {
            background: #f8f9fc;
            border-radius: 26px;
            padding: 16px 18px;
            margin: 10px 0;
            border: 1px solid #c7daf0;
        }
        .customer-item.departed {
            background: #e3f0e3;
        }
        .customer-item.other-user {
            border-left: 6px solid #ff9800;
        }
        .meta-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .time-badge {
            background: #ddeeff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
        }
        .added-time {
            background: #e1f5fe;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .added-by {
            background: #e6d5b8;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .validated-by {
            background: #c8e6c9;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .item-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .btn-depart {
            background: #2b8c5e;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete {
            background: transparent;
            border: 1px solid #d0ddee;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }
        .btn-delete:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .readonly-badge {
            background: #ff9800;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .current-view-badge {
            background: #d4e3fd;
            padding: 8px 16px;
            border-radius: 30px;
            margin: 10px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #2f6d9e;
        }
        .route-steps {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .route-steps li {
            padding: 15px;
            border-bottom: 1px dashed #b5cde0;
        }
        .start-point {
            background: #c8e6c9;
            border-radius: 30px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #4caf50;
        }
        .time-estimate {
            background: #fff3e0;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 5px;
        }
        .urgent-badge {
            background: #ff5252;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Connexion</h2>
            
            <!-- 登录表单 -->
            <div id="loginForm">
                <input type="text" class="login-input" id="loginUsername" placeholder="Nom d'utilisateur">
                <input type="password" class="login-input" id="loginPassword" placeholder="Mot de passe">
                <button class="login-btn" id="loginBtn">Se connecter</button>
                <div class="register-link" id="showRegister">Pas de compte ? S'inscrire</div>
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" style="display:none;">
                <input type="text" class="login-input" id="regUsername" placeholder="Nom d'utilisateur">
                <input type="password" class="login-input" id="regPassword" placeholder="Mot de passe">
                <input type="password" class="login-input" id="regConfirm" placeholder="Confirmer mot de passe">
                <button class="login-btn" id="registerBtn">S'inscrire</button>
                <div class="register-link" id="showLogin">Retour à la connexion</div>
            </div>
        </div>
    </div>

    <!-- 主应用 -->
    <div class="app-container" id="app" style="display: none;">
        <div class="user-info-bar">
            <span id="currentUserDisplay">👤 </span>
            <span id="userRole"></span>
            <button class="logout-btn" id="logoutBtn">Déconnexion</button>
        </div>

        <!-- 管理员区域 -->
        <div class="admin-section" id="adminSection" style="display: none;">
            <h3>👥 使用者管理 (管理员)</h3>
            <div class="user-list" id="userList"></div>
        </div>

        <!-- 用户选择器 -->
        <div class="user-selector">
            <div class="selector-label">👁️ Voir les données d'autres utilisateurs</div>
            <div class="user-buttons" id="userSelectorButtons"></div>
        </div>

        <!-- 日期选择 -->
        <div class="dual-date-section">
            <div class="date-card">
                <div class="label">📅 Date d'ajout</div>
                <input type="date" id="inputDate" class="date-picker-input">
            </div>
            <div class="date-card">
                <div class="label">👁️ Date à visualiser</div>
                <input type="date" id="viewDate" class="date-picker-input">
            </div>
        </div>

        <!-- 司机选项卡 -->
        <div class="driver-tabs" id="driverTabs"></div>

        <!-- 当前视图提示 -->
        <div class="current-view-badge" id="currentViewHint"></div>

        <!-- 录入区域 -->
        <div class="input-section" id="inputSection">
            <div class="section-title">📝 Ajouter un client</div>
            <div class="input-field"><input type="text" id="customerName" placeholder="Nom"></div>
            <div class="input-field"><input type="text" id="customerAddr" placeholder="Adresse"></div>
            <select id="timeType" style="width:100%; padding:14px; margin:10px 0; border-radius:24px; border:1px solid #b9cfe6;">
                <option value="fixed">Heure fixe</option>
                <option value="before">Avant</option>
                <option value="range">Intervalle</option>
                <option value="free">Libre</option>
            </select>
            <div id="timeInputContainer">
                <div class="input-field"><input type="time" id="fixedTime" value="10:00"></div>
            </div>
            <button class="btn-add" id="addCustomerBtn">➕ Ajouter</button>
        </div>

        <!-- 顾客列表 -->
        <h3>📋 Liste des clients</h3>
        <div id="loadingMessage" class="loading" style="display: none;">Chargement...</div>
        <ul class="customer-list" id="customerList"></ul>

        <!-- 路线规划 -->
        <button class="btn-add" id="optimizeRouteBtn" style="background:#ff9f4b; color:#aa5f1e; margin-top:10px;">🗺️ Optimiser l'itinéraire</button>
        <div id="routeOutput" style="display:none; margin-top:20px; padding:16px; background:#edf4fd; border-radius:24px;">
            <h4>🚚 Ordre de livraison suggéré</h4>
            <div id="startPointInfo" class="start-point"></div>
            <ul class="route-steps" id="routeStepsList"></ul>
            <div id="routeNote" style="font-size:0.8rem; color:#3a5b7a; margin-top:10px;"></div>
        </div>
    </div>

    <script>
        (function() {
            // 固定用户
            const FIXED_USERS = {
                'admin': '1234',
                'tayfun': '1909',
                'xuefeng': '1998',
                'steve': '94'
            };

            // 固定起点
            const START_POINT = {
                address: '98 Rue Anselme Rondenay, 94400 Vitry-sur-Seine',
                lat: null,
                lon: null
            };

            // 送货时间范围（分钟）
            const DELIVERY_TIME_RANGE = { min: 30, max: 45 };

            // 本地存储键
            const STORAGE_KEY = 'livreur_customers_v5';
            const USERS_KEY = 'livreur_users_v5';

            // 初始化存储
            function initStorage() {
                if (!localStorage.getItem(STORAGE_KEY)) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
                }
                if (!localStorage.getItem(USERS_KEY)) {
                    localStorage.setItem(USERS_KEY, JSON.stringify({}));
                }
            }
            initStorage();

            // 获取所有顾客
            function getAllCustomers() {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            }

            // 保存顾客
            function saveCustomers(customers) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
            }

            // 获取所有用户
            function getAllUsers() {
                const registered = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
                return { ...FIXED_USERS, ...registered };
            }

            // 保存注册用户
            function saveRegisteredUsers(users) {
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
            }

            let currentUser = null;
            let viewingUser = null;
            let currentDriver = 'Edwin';
            let inputDate = new Date().toISOString().split('T')[0];
            let viewDate = new Date().toISOString().split('T')[0];

            // DOM元素
            const loginOverlay = document.getElementById('loginOverlay');
            const appContainer = document.getElementById('app');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const showRegister = document.getElementById('showRegister');
            const showLogin = document.getElementById('showLogin');
            const regUsername = document.getElementById('regUsername');
            const regPassword = document.getElementById('regPassword');
            const regConfirm = document.getElementById('regConfirm');
            const registerBtn = document.getElementById('registerBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const currentUserDisplay = document.getElementById('currentUserDisplay');
            const userRole = document.getElementById('userRole');
            const adminSection = document.getElementById('adminSection');
            const userSelectorButtons = document.getElementById('userSelectorButtons');
            const userList = document.getElementById('userList');
            const inputSection = document.getElementById('inputSection');
            const driverTabsEl = document.getElementById('driverTabs');
            const currentViewHint = document.getElementById('currentViewHint');
            const inputDatePicker = document.getElementById('inputDate');
            const viewDatePicker = document.getElementById('viewDate');
            const customerListEl = document.getElementById('customerList');
            const loadingMessage = document.getElementById('loadingMessage');
            const optimizeBtn = document.getElementById('optimizeRouteBtn');
            const routeOutputDiv = document.getElementById('routeOutput');
            const routeStepsList = document.getElementById('routeStepsList');
            const routeNote = document.getElementById('routeNote');
            const startPointInfo = document.getElementById('startPointInfo');
            const nameInput = document.getElementById('customerName');
            const addrInput = document.getElementById('customerAddr');
            const timeType = document.getElementById('timeType');
            const timeInputContainer = document.getElementById('timeInputContainer');
            const addBtn = document.getElementById('addCustomerBtn');

            // 设置默认日期
            function setDefaultDates() {
                const today = new Date().toISOString().split('T')[0];
                if (inputDatePicker) inputDatePicker.value = today;
                if (viewDatePicker) viewDatePicker.value = today;
            }

            // 渲染时间输入
            function renderTimeInput() {
                const type = timeType.value;
                let html = '';
                if (type === 'fixed') {
                    html = `<div class="input-field"><input type="time" id="fixedTime" value="10:00"></div>`;
                } else if (type === 'before') {
                    html = `<div class="input-field"><input type="time" id="beforeTime" value="18:00"></div><span>avant</span>`;
                } else if (type === 'range') {
                    html = `<div style="display:flex; gap:5px;"><div class="input-field"><input type="time" id="rangeStart" value="09:00"></div><span> - </span><div class="input-field"><input type="time" id="rangeEnd" value="17:00"></div></div>`;
                } else {
                    html = `<span>Libre</span>`;
                }
                timeInputContainer.innerHTML = html;
            }
            if (timeType) timeType.addEventListener('change', renderTimeInput);

            // 登录
            function login(username, password) {
                const users = getAllUsers();
                if (users[username] && users[username] === password) {
                    currentUser = username;
                    viewingUser = username;
                    currentUserDisplay.innerText = `👤 ${currentUser}`;
                    
                    if (username === 'admin') {
                        userRole.innerText = ' (管理员)';
                        adminSection.style.display = 'block';
                        renderUserList();
                    } else {
                        userRole.innerText = '';
                        adminSection.style.display = 'none';
                    }
                    
                    loginOverlay.style.display = 'none';
                    appContainer.style.display = 'block';
                    
                    currentDriver = 'Edwin';
                    
                    renderUserSelector();
                    renderDriverTabs();
                    renderCustomerList();
                    updateInputSectionState();
                    updateHints();
                    return true;
                }
                return false;
            }

            // 注册
            function register(username, password) {
                const users = getAllUsers();
                if (users[username]) {
                    alert('用户名已存在');
                    return false;
                }
                
                const registered = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
                registered[username] = password;
                saveRegisteredUsers(registered);
                
                alert('注册成功，请登录');
                return true;
            }

            // 管理员删除用户
            window.removeUser = function(username) {
                if (currentUser !== 'admin') return;
                
                if (username === 'admin') {
                    alert('不能删除管理员');
                    return;
                }
                
                if (confirm(`确定删除用户 ${username} 吗？`)) {
                    if (FIXED_USERS[username]) {
                        alert('不能删除固定用户');
                        return;
                    }
                    
                    const registered = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
                    delete registered[username];
                    saveRegisteredUsers(registered);
                    
                    const allCustomers = getAllCustomers();
                    const filtered = allCustomers.filter(c => c.username !== username);
                    saveCustomers(filtered);
                    
                    renderUserList();
                    renderUserSelector();
                    renderCustomerList();
                }
            };

            // 渲染用户列表
            function renderUserList() {
                if (currentUser !== 'admin') return;
                
                const users = getAllUsers();
                let html = '';
                
                Object.keys(users).forEach(username => {
                    if (username === 'admin') return;
                    html += `
                        <div class="user-tag">
                            👤 ${username} ${FIXED_USERS[username] ? '(固定)' : ''}
                            ${!FIXED_USERS[username] ? '<span class="remove-user" onclick="removeUser(\'' + username + '\')">✕</span>' : ''}
                        </div>
                    `;
                });
                
                userList.innerHTML = html || '<p>暂无其他用户</p>';
            }

            // 渲染用户选择器
            function renderUserSelector() {
                const users = getAllUsers();
                let html = '';
                
                Object.keys(users).forEach(username => {
                    if (username === 'admin') return;
                    const activeClass = (viewingUser === username) ? 'active' : '';
                    const ownClass = (username === currentUser) ? 'own' : '';
                    const label = username === currentUser ? `${username} (moi)` : username;
                    html += `<button class="user-button ${activeClass} ${ownClass}" data-user="${username}">👤 ${label}</button>`;
                });
                
                userSelectorButtons.innerHTML = html;

                document.querySelectorAll('.user-button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        viewingUser = btn.dataset.user;
                        renderUserSelector();
                        renderDriverTabs();
                        renderCustomerList();
                        updateInputSectionState();
                        updateHints();
                        routeOutputDiv.style.display = 'none';
                    });
                });
            }

            // 更新录入区域状态
            function updateInputSectionState() {
                if (viewingUser === currentUser) {
                    inputSection.classList.remove('disabled');
                } else {
                    inputSection.classList.add('disabled');
                }
            }

            // 渲染司机选项卡
            function renderDriverTabs() {
                const drivers = ['Edwin', 'Jismon', 'Wang'];
                let html = '';
                drivers.forEach(driver => {
                    const activeClass = (currentDriver === driver) ? 'active' : '';
                    html += `<button class="driver-tab ${activeClass}" data-driver="${driver}">👤 ${driver}</button>`;
                });
                driverTabsEl.innerHTML = html;

                document.querySelectorAll('.driver-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        currentDriver = tab.dataset.driver;
                        renderDriverTabs();
                        renderCustomerList();
                        updateHints();
                        routeOutputDiv.style.display = 'none';
                    });
                });
            }

            // 更新提示
            function updateHints() {
                if (currentViewHint) {
                    currentViewHint.innerText = `Utilisateur: ${currentUser} | Vue: ${viewingUser} | Chauffeur: ${currentDriver} | Date: ${viewDate}`;
                }
            }

            // 日期变更
            if (inputDatePicker) {
                inputDatePicker.addEventListener('change', (e) => {
                    inputDate = e.target.value;
                });
            }

            if (viewDatePicker) {
                viewDatePicker.addEventListener('change', (e) => {
                    viewDate = e.target.value;
                    renderCustomerList();
                    routeOutputDiv.style.display = 'none';
                    updateHints();
                });
            }

            // 获取时间值
            function getTimeValue() {
                const type = timeType.value;
                if (type === 'fixed') {
                    const fixed = document.getElementById('fixedTime');
                    return { type: 'fixed', value: fixed ? fixed.value : '10:00' };
                } else if (type === 'before') {
                    const before = document.getElementById('beforeTime');
                    return { type: 'before', value: before ? before.value : '18:00' };
                } else if (type === 'range') {
                    const start = document.getElementById('rangeStart');
                    const end = document.getElementById('rangeEnd');
                    return { type: 'range', value: { start: start ? start.value : '09:00', end: end ? end.value : '17:00' } };
                } else {
                    return { type: 'free', value: null };
                }
            }

            // 格式化时间要求
            function formatTimeRequirement(customer) {
                const t = customer.time_req;
                if (!t) return '⏰ Libre';
                if (t.type === 'fixed') return `⏰ ${t.value}`;
                if (t.type === 'before') return `⏰ avant ${t.value}`;
                if (t.type === 'range') return `⏰ ${t.value.start} - ${t.value.end}`;
                return '⏰ Libre';
            }

            // 获取时间窗口长度（分钟）
            function getTimeWindowLength(customer) {
                if (!customer.time_req) return 24 * 60; // 自由安排算24小时
                if (customer.time_req.type === 'free') return 24 * 60;
                if (customer.time_req.type === 'fixed') return 0; // 固定时间窗口为0
                if (customer.time_req.type === 'before') {
                    const [h, m] = customer.time_req.value.split(':').map(Number);
                    return h * 60 + m;
                }
                if (customer.time_req.type === 'range') {
                    const [h1, m1] = customer.time_req.value.start.split(':').map(Number);
                    const [h2, m2] = customer.time_req.value.end.split(':').map(Number);
                    return (h2 * 60 + m2) - (h1 * 60 + m1);
                }
                return 24 * 60;
            }

            // 获取开始时间（分钟）
            function getStartTimeMinutes(customer) {
                if (!customer.time_req) return 24 * 60;
                if (customer.time_req.type === 'free') return 24 * 60;
                if (customer.time_req.type === 'fixed') {
                    const [h, m] = customer.time_req.value.split(':').map(Number);
                    return h * 60 + m;
                }
                if (customer.time_req.type === 'before') {
                    const [h, m] = customer.time_req.value.split(':').map(Number);
                    return h * 60 + m;
                }
                if (customer.time_req.type === 'range') {
                    const [h, m] = customer.time_req.value.start.split(':').map(Number);
                    return h * 60 + m;
                }
                return 24 * 60;
            }

            // 获取结束时间（分钟）
            function getEndTimeMinutes(customer) {
                if (!customer.time_req) return 24 * 60;
                if (customer.time_req.type === 'free') return 24 * 60;
                if (customer.time_req.type === 'fixed') {
                    const [h, m] = customer.time_req.value.split(':').map(Number);
                    return h * 60 + m;
                }
                if (customer.time_req.type === 'before') {
                    const [h, m] = customer.time_req.value.split(':').map(Number);
                    return h * 60 + m;
                }
                if (customer.time_req.type === 'range') {
                    const [h, m] = customer.time_req.value.end.split(':').map(Number);
                    return h * 60 + m;
                }
                return 24 * 60;
            }

            // 格式化添加时间
            function formatAddedTime(timestamp) {
                if (!timestamp) return '';
                const date = new Date(timestamp);
                return date.toLocaleString('fr-FR', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
            }

            // 计算两点距离
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = 
                    Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            // 获取比较时间
            function getCompareTime(customer) {
                if (!customer.time_req || customer.time_req.type === 'free') return '23:59';
                if (customer.time_req.type === 'fixed') return customer.time_req.value;
                if (customer.time_req.type === 'before') return customer.time_req.value;
                if (customer.time_req.type === 'range') return customer.time_req.value.start;
                return '23:59';
            }

            // 添加顾客
            addBtn.addEventListener('click', () => {
                if (viewingUser !== currentUser) {
                    alert('Vous ne pouvez ajouter que dans vos propres données');
                    return;
                }

                const name = nameInput.value.trim();
                const addr = addrInput.value.trim();
                if (!name || !addr) {
                    alert('Veuillez remplir le nom et l\'adresse');
                    return;
                }

                const timeReq = getTimeValue();
                const now = Date.now();
                const newCustomer = {
                    id: now + '-' + Math.random().toString(36),
                    username: currentUser,
                    driver: currentDriver,
                    date: inputDate,
                    customer_name: name,
                    customer_address: addr,
                    time_req: timeReq,
                    added_time: now,
                    added_by: currentUser,
                    departed: false,
                    departure_time: null,
                    departed_by: null,
                    lat: null,
                    lon: null
                };

                const allCustomers = getAllCustomers();
                allCustomers.push(newCustomer);
                saveCustomers(allCustomers);

                nameInput.value = '';
                addrInput.value = '';

                if (viewDate === inputDate && viewingUser === currentUser) {
                    renderCustomerList();
                }
                routeOutputDiv.style.display = 'none';
            });

            // 删除顾客
            function deleteCustomer(custId) {
                if (viewingUser !== currentUser) {
                    alert('Vous ne pouvez pas supprimer les données d\'autres utilisateurs');
                    return;
                }

                const allCustomers = getAllCustomers();
                const filtered = allCustomers.filter(c => c.id !== custId);
                saveCustomers(filtered);
                
                if (viewingUser === currentUser) {
                    renderCustomerList();
                }
                routeOutputDiv.style.display = 'none';
            }

            // 标记出发
            function markCustomerDeparted(custId) {
                const allCustomers = getAllCustomers();
                const customer = allCustomers.find(c => c.id === custId);
                if (customer && !customer.departed) {
                    customer.departed = true;
                    customer.departure_time = Date.now();
                    customer.departed_by = currentUser;
                    saveCustomers(allCustomers);
                    renderCustomerList();
                }
            }

            // 渲染顾客列表
            function renderCustomerList() {
                const allCustomers = getAllCustomers();
                const filtered = allCustomers.filter(c => 
                    c.username === viewingUser && 
                    c.driver === currentDriver && 
                    c.date === viewDate
                ).sort((a,b) => b.added_time - a.added_time);
                
                const isOwnData = (viewingUser === currentUser);

                let html = '';
                if (filtered.length === 0) {
                    html = '<li style="padding:30px; text-align:center; color:#8899bb;">Aucun client</li>';
                } else {
                    filtered.forEach(c => {
                        const timeDisplay = formatTimeRequirement(c);
                        const addedDisplay = formatAddedTime(c.added_time);
                        const departedClass = c.departed ? 'departed' : '';
                        const otherUserClass = (c.added_by !== viewingUser) ? 'other-user' : '';
                        const departedInfo = c.departed ? 
                            `<div>🚚 Départ: ${new Date(c.departure_time).toLocaleTimeString()}</div>` : '';
                        const validatedInfo = c.departed && c.departed_by ? 
                            `<span class="validated-by">✅ Validé par: ${c.departed_by}</span>` : '';
                        
                        const showDepart = true;
                        const showDelete = isOwnData;
                        
                        html += `
                            <li class="customer-item ${departedClass} ${otherUserClass}">
                                <div><strong>${escapeHtml(c.customer_name)}</strong></div>
                                <div>📍 ${escapeHtml(c.customer_address)}</div>
                                <div class="meta-row">
                                    <span class="time-badge">${timeDisplay}</span>
                                    <span class="added-time">📌 ${addedDisplay}</span>
                                    <span class="added-by">👤 ${escapeHtml(c.added_by || 'unknown')}</span>
                                    ${validatedInfo}
                                </div>
                                ${departedInfo}
                                <div class="item-actions">
                                    ${showDepart ? `<button class="btn-depart" ${c.departed ? 'disabled' : ''} data-id="${c.id}">🚚 Partir</button>` : ''}
                                    ${showDelete ? `<button class="btn-delete" ${c.departed ? 'disabled' : ''} data-id="${c.id}">🗑️ Supprimer</button>` : ''}
                                    ${!showDepart && !showDelete ? '<span class="readonly-badge">🔒 Lecture seule</span>' : ''}
                                </div>
                            </li>
                        `;
                    });
                }
                customerListEl.innerHTML = html;

                document.querySelectorAll('.btn-depart').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        markCustomerDeparted(btn.dataset.id);
                    });
                });
                
                if (isOwnData) {
                    document.querySelectorAll('.btn-delete').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteCustomer(btn.dataset.id);
                        });
                    });
                }
            }

            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 获取起点的经纬度
            async function getStartPointCoords() {
                if (START_POINT.lat && START_POINT.lon) return;
                
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(START_POINT.address)}&countrycodes=fr&limit=1`,
                        { headers: { 'User-Agent': 'Livreur-App/1.0' } }
                    );
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        START_POINT.lat = parseFloat(data[0].lat);
                        START_POINT.lon = parseFloat(data[0].lon);
                    }
                } catch (error) {
                    console.error('获取起点坐标失败:', error);
                }
            }

            // 路线规划 - 修正版
            optimizeBtn.addEventListener('click', async () => {
                const allCustomers = getAllCustomers();
                const pending = allCustomers.filter(c => 
                    c.username === viewingUser && 
                    c.driver === currentDriver && 
                    c.date === viewDate &&
                    !c.departed
                );
                
                if (pending.length === 0) {
                    alert('Aucun client en attente');
                    return;
                }

                optimizeBtn.innerHTML = '🔄 Calcul...';
                optimizeBtn.disabled = true;
                loadingMessage.style.display = 'block';
                routeOutputDiv.style.display = 'none';

                try {
                    // 获取起点坐标
                    await getStartPointCoords();
                    
                    // 获取所有顾客的经纬度
                    const customersWithCoords = [];
                    
                    for (const customer of pending) {
                        if (customer.lat && customer.lon) {
                            customersWithCoords.push(customer);
                            continue;
                        }
                        
                        try {
                            const address = customer.customer_address;
                            const response = await fetch(
                                `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=fr&limit=1`,
                                { headers: { 'User-Agent': 'Livreur-App/1.0' } }
                            );
                            const data = await response.json();
                            
                            if (data && data.length > 0) {
                                customer.lat = parseFloat(data[0].lat);
                                customer.lon = parseFloat(data[0].lon);
                                customersWithCoords.push(customer);
                                
                                const all = getAllCustomers();
                                const idx = all.findIndex(c => c.id === customer.id);
                                if (idx !== -1) {
                                    all[idx].lat = customer.lat;
                                    all[idx].lon = customer.lon;
                                    saveCustomers(all);
                                }
                                
                                await new Promise(r => setTimeout(r, 200));
                            } else {
                                customersWithCoords.push(customer);
                            }
                        } catch (error) {
                            customersWithCoords.push(customer);
                        }
                    }
                    
                    // 分离有坐标和没坐标的
                    const withCoords = customersWithCoords.filter(c => c.lat && c.lon);
                    const withoutCoords = customersWithCoords.filter(c => !c.lat || !c.lon);
                    
                    // 计算每个顾客的优先级分数（分数越低越优先）
                    function calculatePriority(customer) {
                        if (!customer.time_req || customer.time_req.type === 'free') {
                            return 1000; // 自由安排优先级最低
                        }
                        
                        const startTime = getStartTimeMinutes(customer);
                        const endTime = getEndTimeMinutes(customer);
                        const windowLength = endTime - startTime;
                        
                        // 当前时间（假设9点出发）
                        const currentTime = 9 * 60;
                        
                        // 如果开始时间已经过了，很紧急
                        if (startTime < currentTime) {
                            return 1;
                        }
                        
                        // 基础分：开始时间越早越优先
                        const baseScore = startTime;
                        
                        // 窗口长度越短越优先（每短1分钟加1分紧急度）
                        const urgencyBonus = Math.max(0, 120 - windowLength) / 2;
                        
                        return baseScore - urgencyBonus;
                    }
                    
                    // 按优先级排序
                    withCoords.sort((a, b) => {
                        return calculatePriority(a) - calculatePriority(b);
                    });
                    
                    // 构建最终路线
                    let finalRoute = [];
                    let remaining = [...withCoords];
                    
                    // 第一个点：优先级最高的
                    if (remaining.length > 0) {
                        finalRoute.push(remaining[0]);
                        remaining = remaining.slice(1);
                    }
                    
                    // 后续点：从当前位置找最近的下一个
                    while (remaining.length > 0) {
                        const current = finalRoute[finalRoute.length - 1];
                        
                        let bestIdx = 0;
                        let bestDist = Infinity;
                        
                        for (let i = 0; i < remaining.length; i++) {
                            const dist = calculateDistance(
                                current.lat, current.lon,
                                remaining[i].lat, remaining[i].lon
                            );
                            
                            if (dist < bestDist) {
                                bestDist = dist;
                                bestIdx = i;
                            }
                        }
                        
                        finalRoute.push(remaining[bestIdx]);
                        remaining = remaining.filter((_, i) => i !== bestIdx);
                    }
                    
                    // 没坐标的按开始时间排序
                    withoutCoords.sort((a, b) => {
                        const startA = getStartTimeMinutes(a);
                        const startB = getStartTimeMinutes(b);
                        return startA - startB;
                    });
                    
                    finalRoute = [...finalRoute, ...withoutCoords];
                    
                    // 显示路线和时间预估
                    displayRouteWithTimes(finalRoute, withCoords.length);
                    
                } catch (error) {
                    console.error('路线规划失败:', error);
                    alert('Erreur: ' + error.message);
                } finally {
                    optimizeBtn.innerHTML = '🗺️ Optimiser l\'itinéraire';
                    optimizeBtn.disabled = false;
                    loadingMessage.style.display = 'none';
                }
            });

            // 显示路线和时间预估
            function displayRouteWithTimes(route, withCoordCount) {
                let stepsHtml = '';
                let totalDistance = 0;
                let prevLat = START_POINT.lat;
                let prevLon = START_POINT.lon;
                
                // 起点信息
                startPointInfo.innerHTML = `
                    <strong>🚩 Départ:</strong> ${START_POINT.address}<br>
                    <small>Heure de départ suggérée: 09:00</small>
                `;
                
                // 计算每个站点的预计时间
                let currentTime = new Date();
                currentTime.setHours(9, 0, 0); // 假设9点出发
                
                route.forEach((c, idx) => {
                    const timeDisplay = formatTimeRequirement(c);
                    const hasCoords = c.lat && c.lon ? '🟢' : '🟡';
                    
                    // 计算紧急程度
                    const startTime = getStartTimeMinutes(c);
                    const endTime = getEndTimeMinutes(c);
                    const windowLength = endTime - startTime;
                    
                    let urgencyBadge = '';
                    if (c.time_req && c.time_req.type !== 'free') {
                        if (windowLength <= 60) {
                            urgencyBadge = '<span class="urgent-badge">🔴 URGENT</span>';
                        } else if (windowLength <= 120) {
                            urgencyBadge = '<span class="urgent-badge" style="background:#ff9800;">🟠 Pressé</span>';
                        }
                    }
                    
                    // 计算距离和行驶时间
                    let distanceText = '';
                    let travelTime = 0;
                    let arrivalTime = '';
                    
                    if (prevLat && prevLon && c.lat && c.lon) {
                        const dist = calculateDistance(prevLat, prevLon, c.lat, c.lon);
                        totalDistance += dist;
                        
                        // 行驶时间 = 距离 / 30km/h * 60分钟
                        travelTime = Math.round(dist / 30 * 60);
                        
                        // 送货时间 = 30-45分钟随机
                        const deliveryTime = Math.floor(Math.random() * (DELIVERY_TIME_RANGE.max - DELIVERY_TIME_RANGE.min + 1)) + DELIVERY_TIME_RANGE.min;
                        
                        // 到达时间 = 当前时间 + 行驶时间 + 送货时间
                        currentTime.setMinutes(currentTime.getMinutes() + travelTime + deliveryTime);
                        
                        arrivalTime = currentTime.toLocaleTimeString('fr-FR', { 
                            hour: '2-digit', 
                            minute: '2-digit'
                        });
                        
                        distanceText = `
                            <div class="time-estimate">
                                🚗 ${dist.toFixed(1)}km (${travelTime}min)
                                📦 Livraison: ${deliveryTime}min
                                🕒 Arrivée: ${arrivalTime}
                                ${urgencyBadge}
                            </div>
                        `;
                    }
                    
                    stepsHtml += `
                        <li style="display: flex; align-items: flex-start; padding: 12px; border-bottom: 1px dashed #ccc;">
                            <span style="background:#f09b4b; color:white; width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; margin-right:10px; flex-shrink:0;">${idx+1}</span>
                            <div style="flex:1;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <strong>${escapeHtml(c.customer_name)}</strong>
                                    <span style="background:#e6d5b8; padding:2px 8px; border-radius:20px; font-size:0.7rem;">👤 ${escapeHtml(c.added_by)}</span>
                                </div>
                                <div style="font-size:0.9rem; color:#666;">${escapeHtml(c.customer_address)} ${hasCoords}</div>
                                <div style="display:flex; gap:8px; flex-wrap: wrap; margin-top:5px;">
                                    <span style="background:#ffe6c0; padding:2px 8px; border-radius:20px; font-size:0.8rem;">${timeDisplay}</span>
                                </div>
                                ${distanceText}
                            </div>
                        </li>
                    `;
                    
                    if (c.lat && c.lon) {
                        prevLat = c.lat;
                        prevLon = c.lon;
                    }
                });
                
                routeStepsList.innerHTML = stepsHtml;
                
                routeNote.innerHTML = `
                    <div style="background:#f5f5f5; padding:15px; border-radius:20px; margin-top:15px;">
                        <p><strong>📊 统计</strong></p>
                        <p>🚗 总距离: ${totalDistance.toFixed(1)} km</p>
                        <p>📍 有坐标: ${withCoordCount} 个 | 🟡 无坐标: ${route.length - withCoordCount} 个</p>
                        <p><small>🟢 有坐标 | 🟡 无坐标（按时间排序）</small></p>
                        <p><small>🔴 URGENT: 窗口≤1小时 | 🟠 Pressé: 窗口≤2小时</small></p>
                        <p><small>* 行驶速度按30km/h估算，每站送货30-45分钟</small></p>
                        <p><small>* 排序规则: 先按紧急程度，再按距离优化</small></p>
                    </div>
                `;
                
                routeOutputDiv.style.display = 'block';
            }

            // 登录按钮
            loginBtn.addEventListener('click', () => {
                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();
                const success = login(username, password);
                if (!success) {
                    alert('Nom d\'utilisateur ou mot de passe incorrect');
                }
            });

            // 回车登录
            if (loginPassword) {
                loginPassword.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') loginBtn.click();
                });
            }

            // 显示注册
            showRegister.addEventListener('click', () => {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            });

            showLogin.addEventListener('click', () => {
                registerForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            // 注册按钮
            registerBtn.addEventListener('click', () => {
                const username = regUsername.value.trim();
                const password = regPassword.value.trim();
                const confirm = regConfirm.value.trim();
                
                if (!username || !password) {
                    alert('Veuillez remplir tous les champs');
                    return;
                }
                if (password !== confirm) {
                    alert('Les mots de passe ne correspondent pas');
                    return;
                }
                
                const success = register(username, password);
                if (success) {
                    registerForm.style.display = 'none';
                    loginForm.style.display = 'block';
                    regUsername.value = '';
                    regPassword.value = '';
                    regConfirm.value = '';
                }
            });

            // 登出
            logoutBtn.addEventListener('click', () => {
                currentUser = null;
                viewingUser = null;
                appContainer.style.display = 'none';
                loginOverlay.style.display = 'flex';
                loginUsername.value = '';
                loginPassword.value = '';
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            });

            // 初始化
            setDefaultDates();
            renderTimeInput();
        })();
    </script>
</body>
</html>
